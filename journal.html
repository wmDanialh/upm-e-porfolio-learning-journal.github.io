<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Portfolio : Learning Journal — My Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="wrap page-main">
      <header class="page-heading">
        <p class="eyebrow">THE STORY SO FAR</p>
        <h1>My Journal</h1>
        <p>
          Notes from lectures, new discoveries, difficult days and little
          victories.
        </p>
      </header>
      <div class="journal-tools">
        <input
          id="search-input"
          type="search"
          placeholder="Search entries..."
          aria-label="Search journal entries"
        />
        <select id="category-filter" aria-label="Filter by category">
          <option value="all">All categories</option>
        </select>
        <select id="sort-order" aria-label="Sort entries">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
      </div>
      <p id="results-count" class="muted small"></p>
      <div id="journal-list" class="journal-list"></div>
      <p class="editor-note">
        To add or edit published entries, update
        <code>data/posts.json</code> and push your changes to GitHub.
      </p>
    </main>
    <div id="site-footer"></div>
    <script src="assets/js/site.js?v=4"></script>
    <script src="assets/js/data-loader.js?v=4"></script>
  </body>
</html>
